  Observaciones clave del ejemplo:
    - La línea base (merge_line_id=501) aparece UNA vez con line_kind="from_albaran".
    - Siguen 6 líneas sintéticas (merge_line_id=null, parent_merge_line_id=501).
    - Orden: año 2025, año 2026, consistencia, árido, fibra, residuos.
    - El año 2026 se emite aunque el PDF no lo tarife (Forma C): el
      revisor decidirá si factura.
    - unidad_categoria_albaran se hereda (volume en todas); el backend
      (svc6) resuelve la unidad concreta en "m3" leyendo la del parent.
